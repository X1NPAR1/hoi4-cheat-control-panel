 CCP_SETTINGS_COMPAT:0 "COMPATIBILITY"
 CCP_SETTINGS_COMPAT_HELP:0 "This mod overrides no vanilla file and every name it defines is prefixed ccp_, so it sits alongside other mods rather than fighting them. It is built for singleplayer: the engine gives script no way to detect a multiplayer session, so nothing here can be hidden automatically, and country switching, annexation and state transfers can desync a multiplayer game."
 CCP_SETTINGS_CONFIRM:0 "CONFIRMATIONS"
 CCP_SETTINGS_CONFIRM_HELP:0 "Destructive actions ask before they apply. There is no undo, so leaving this on is safer."
 CCP_SETTINGS_CONFIRM_TOOLTIP:0 "Toggle the confirmation prompt shown before annexations, state transfers and core removal."
 CCP_SETTINGS_DIPLO:0 "DIPLOMACY"
 CCP_SETTINGS_DIPLO_HELP:0 "The console switches allowdiplo and yesman cannot be reached from a mod. These two do what they are used for, through the game's own rules: the first lifts every diplomatic restriction script can lift, the second makes every country strongly favourable towards you."
 CCP_SETTINGS_DIPLO_TOOLTIP:0 "Lift faction, guarantee, puppet, volunteer, market and same-ideology war restrictions."
 CCP_SETTINGS_GOODWILL_TOOLTIP:0 "Give every country a large positive opinion of you and tell their AI to befriend you. It does not force acceptance, which no effect can do, but it moves the AI as far as script reaches."
 CCP_SETTINGS_HOTKEY:0 "HOTKEY"
