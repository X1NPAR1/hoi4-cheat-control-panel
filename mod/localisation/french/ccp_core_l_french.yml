 CCP_SETTINGS_COMPAT:0 "COMPATIBILITÉ"
 CCP_SETTINGS_COMPAT_HELP:0 "Ce mod ne remplace aucun fichier vanilla et tous ses identifiants commencent par ccp_ ; il cohabite donc avec les autres mods. Il est conçu pour le solo : le script ne peut pas détecter une partie multijoueur, rien ne peut donc être masqué automatiquement, et changer de pays, annexer ou transférer des États peut désynchroniser une partie multijoueur."
 CCP_SETTINGS_CONFIRM:0 "CONFIRMATIONS"
 CCP_SETTINGS_CONFIRM_HELP:0 "Les actions irréversibles demandent confirmation. Il n'y a pas d'annulation, mieux vaut les laisser actives."
 CCP_SETTINGS_CONFIRM_TOOLTIP:0 "Active ou désactive la confirmation avant annexions, transferts d'État et retraits de territoire national."
 CCP_SETTINGS_DIPLO:0 "DIPLOMATIE"
 CCP_SETTINGS_DIPLO_HELP:0 "Les commandes console allowdiplo et yesman sont hors de portée d un mod. Ces deux boutons obtiennent le même résultat via les règles du jeu : le premier lève toutes les restrictions diplomatiques accessibles au script, le second rend tous les pays très favorables envers vous."
 CCP_SETTINGS_DIPLO_TOOLTIP:0 "Lève les restrictions sur factions, garanties, vassaux, volontaires, marché et guerres entre mêmes idéologies."
 CCP_SETTINGS_GOODWILL_TOOLTIP:0 "Donne à chaque pays une opinion très positive de vous et demande à leur IA de se lier d amitié. Cela ne force pas l acceptation, aucun effet ne le peut, mais cela pousse l IA aussi loin que le script permet."
