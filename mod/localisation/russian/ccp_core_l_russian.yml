 CCP_SETTINGS_COMPAT:0 "СОВМЕСТИМОСТЬ"
 CCP_SETTINGS_COMPAT_HELP:0 "Мод не переопределяет ванильные файлы, а все его имена начинаются с ccp_, поэтому он уживается с другими модами. Он рассчитан на одиночную игру: скрипт не может определить сетевую сессию, поэтому ничего нельзя скрыть автоматически, а смена страны, аннексия и передача провинций могут вызвать рассинхрон в сетевой игре."
 CCP_SETTINGS_CONFIRM:0 "ПОДТВЕРЖДЕНИЕ"
 CCP_SETTINGS_CONFIRM_HELP:0 "Необратимые действия запрашивают подтверждение. Отмены нет, поэтому безопаснее оставить включённым."
 CCP_SETTINGS_CONFIRM_TOOLTIP:0 "Включает подтверждение перед аннексией, передачей провинций и снятием коренных территорий."
 CCP_SETTINGS_DIPLO:0 "ДИПЛОМАТИЯ"
 CCP_SETTINGS_DIPLO_HELP:0 "Консольные переключатели allowdiplo и yesman недоступны моду. Эти две кнопки дают тот же результат через правила игры: первая снимает все дипломатические ограничения, доступные скрипту, вторая делает все страны крайне благосклонными к вам."
 CCP_SETTINGS_DIPLO_TOOLTIP:0 "Снимает ограничения на фракции, гарантии, марионеток, добровольцев, рынок и войну против своей идеологии."
 CCP_SETTINGS_GOODWILL_TOOLTIP:0 "Даёт всем странам крайне положительное мнение о вас и велит их ИИ дружить с вами. Согласие это не гарантирует, ни один эффект этого не может, но двигает ИИ настолько, насколько позволяет скрипт."
 CCP_SETTINGS_HOTKEY:0 "ГОРЯЧАЯ КЛАВИША"
 CCP_SETTINGS_HOTKEY_CURRENT:0 "Текущая клавиша: [CCP_GetHotkeyName]"
 CCP_SETTINGS_HOTKEY_HELP:0 "Выберите клавишу для открытия и закрытия панели. Выбор сохраняется вместе с игрой."
 CCP_SETTINGS_LANGUAGE:0 "ЯЗЫК"
 CCP_SETTINGS_LANGUAGE_HELP:0 "Панель следует языку игры. Английский, немецкий, французский и русский входят в мод. В Hearts of Iron IV нет турецкого и нидерландского, поэтому они ставятся наложением — см. README."
 CCP_SETTINGS_LAUNCHER_TOOLTIP:0 "Где кнопка-логотип: под верхней панелью, в правом нижнем углу или скрыта.\nСкрытой панель по-прежнему открывается клавишей [CCP_GetHotkeyName]."
