 CCP_SETTINGS_COMPAT_HELP:0 "Dieser Mod überschreibt keine Vanilla-Datei und alle Bezeichner beginnen mit ccp_, er steht also neben anderen Mods, statt mit ihnen zu kollidieren. Er ist für den Einzelspieler gedacht: Skript kann eine Mehrspielerpartie nicht erkennen, also lässt sich hier nichts automatisch ausblenden, und Länderwechsel, Annexionen und Staatsübergaben können eine Mehrspielerpartie desynchronisieren."
