 CCP_SETTINGS_COMPAT:0 "KOMPATIBILITÄT"
 CCP_SETTINGS_COMPAT_HELP:0 "Dieser Mod überschreibt keine Vanilla-Datei und alle Bezeichner beginnen mit ccp_, er steht also neben anderen Mods, statt mit ihnen zu kollidieren. Er ist für den Einzelspieler gedacht: Skript kann eine Mehrspielerpartie nicht erkennen, also lässt sich hier nichts automatisch ausblenden, und Länderwechsel, Annexionen und Staatsübergaben können eine Mehrspielerpartie desynchronisieren."
 CCP_SETTINGS_CONFIRM:0 "BESTÄTIGUNGEN"
 CCP_SETTINGS_CONFIRM_HELP:0 "Unumkehrbare Aktionen fragen vorher nach. Es gibt kein Rückgängig, daher ist Anlassen sicherer."
 CCP_SETTINGS_CONFIRM_TOOLTIP:0 "Schaltet die Bestätigung vor Annexionen, Staatsübergaben und dem Entfernen von Kerngebieten um."
 CCP_SETTINGS_DIPLO:0 "DIPLOMATIE"
 CCP_SETTINGS_DIPLO_HELP:0 "Die Konsolenschalter allowdiplo und yesman sind aus einem Mod nicht erreichbar. Diese beiden erreichen ihren Zweck über die Spielregeln: der erste hebt jede per Skript aufhebbare diplomatische Beschränkung auf, der zweite macht jedes Land Ihnen gegenüber ausgesprochen wohlgesinnt."
 CCP_SETTINGS_DIPLO_TOOLTIP:0 "Hebt Beschränkungen für Fraktionen, Garantien, Marionetten, Freiwillige, Markt und Kriege gegen die eigene Ideologie auf."
 CCP_SETTINGS_GOODWILL_TOOLTIP:0 "Gibt jedem Land eine stark positive Meinung von Ihnen und weist dessen KI an, sich mit Ihnen anzufreunden. Eine Zustimmung erzwingt es nicht, das kann kein Effekt, aber es bewegt die KI so weit wie Skript reicht."
