 CCP_SETTINGS_COMPAT:0 "UYUMLULUK"
 CCP_SETTINGS_COMPAT_HELP:0 "Bu mod hiçbir vanilla dosyasını ezmez ve tanımladığı her ad ccp_ ile başlar; bu yüzden diğer modlarla çakışmak yerine yanlarında durur. Tek oyunculu için tasarlandı: engine, script'e çok oyunculu oturumu tespit etme imkânı vermiyor, dolayısıyla burada hiçbir şey otomatik gizlenemez ve ülke değiştirme, ilhak ve eyalet devri çok oyunculu bir oyunu desenkronize edebilir."
 CCP_SETTINGS_CONFIRM:0 "ONAY İSTEMİ"
 CCP_SETTINGS_CONFIRM_HELP:0 "Geri alınamaz işlemler uygulanmadan önce sorar. Geri alma özelliği yok, açık bırakmak daha güvenlidir."
 CCP_SETTINGS_CONFIRM_TOOLTIP:0 "İlhak, eyalet devri ve core kaldırma öncesi gösterilen onay istemini açıp kapatır."
 CCP_SETTINGS_DIPLO:0 "DİPLOMASİ"
 CCP_SETTINGS_DIPLO_HELP:0 "allowdiplo ve yesman konsol anahtarlarına bir mod erişemez. Bu iki düğme aynı sonucu oyunun kendi kurallarıyla verir: ilki script'in kaldırabildiği tüm diplomatik kısıtları kaldırır, ikincisi tüm ülkeleri size karşı son derece olumlu yapar."
 CCP_SETTINGS_DIPLO_TOOLTIP:0 "Hizip, garanti, kukla, gönüllü, pazar ve aynı ideolojiye savaş kısıtlarını kaldırır."
 CCP_SETTINGS_GOODWILL_TOOLTIP:0 "Tüm ülkelere size karşı büyük bir olumlu görüş verir ve yapay zekâlarına sizinle dost olmalarını söyler. Kabulü zorlamaz, bunu hiçbir efekt yapamaz, ama yapay zekâyı script'in ulaştığı yere kadar çeker."
