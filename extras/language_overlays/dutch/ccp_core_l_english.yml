 CCP_SETTINGS_COMPAT:0 "COMPATIBILITEIT"
 CCP_SETTINGS_COMPAT_HELP:0 "Deze mod overschrijft geen enkel vanilla-bestand en elke naam begint met ccp_, dus hij staat naast andere mods in plaats van ermee te botsen. Hij is voor singleplayer gemaakt: script kan een multiplayersessie niet detecteren, dus niets kan automatisch worden verborgen, en van land wisselen, annexeren en staten overdragen kunnen een multiplayerspel desynchroniseren."
 CCP_SETTINGS_CONFIRM:0 "BEVESTIGINGEN"
 CCP_SETTINGS_CONFIRM_HELP:0 "Onomkeerbare acties vragen eerst om bevestiging. Er is geen ongedaan maken, dus aan laten is veiliger."
 CCP_SETTINGS_CONFIRM_TOOLTIP:0 "Schakelt de bevestiging vóór annexaties, staatsoverdrachten en het verwijderen van kerngebied."
 CCP_SETTINGS_DIPLO:0 "DIPLOMATIE"
 CCP_SETTINGS_DIPLO_HELP:0 "De consoleschakelaars allowdiplo en yesman zijn onbereikbaar voor een mod. Deze twee bereiken hetzelfde via de spelregels: de eerste heft elke diplomatieke beperking op die script kan opheffen, de tweede maakt elk land zeer welwillend tegenover jou."
 CCP_SETTINGS_DIPLO_TOOLTIP:0 "Heft beperkingen op voor facties, garanties, vazallen, vrijwilligers, markt en oorlog tegen dezelfde ideologie."
 CCP_SETTINGS_GOODWILL_TOOLTIP:0 "Geeft elk land een sterk positieve mening over jou en zegt hun AI je te vriend te houden. Het dwingt geen acceptatie af, geen enkel effect kan dat, maar het duwt de AI zo ver als script reikt."
